services:
  wellmed_dev:
    container_name: wellmed-backbone-dev
    image: wellmed-backbone-dev
    build:
      context: .
      dockerfile: ./docker-arm-dev/app/Dockerfile
      target: development
    ports:
      - "${WELLMED_BACKBONE_PORT:-9010}:${WELLMED_BACKBONE_PORT:-9010}"
    volumes:
      - ./repositories:/app/repositories
      - ./app:/app/app
      - ./features:/app/features
      - ./config:/app/config
      - ./public:/app/public
      - ./bootstrap/app.php:/app/bootstrap/app.php
      - ./database:/app/database
      - ./projects/wellmed-backbone:/app/projects/wellmed-backbone
      - ./projects/wellmed-gateway:/app/projects/wellmed-gateway
      - ./routes/api-backbone.php:/app/routes/api.php
      - ./composer_backbone.json:/app/composer.json
      - ./.env.backbone:/app/.env
      - ./docker/conf.d/upload.ini:/usr/local/etc/php/conf.d/upload.ini
      - wellmed_backbone_storage_dev:/app/storage
      - ./node_modules:/app/node_modules
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9010 || exit 1"]
    networks:
      - wellmed-core-dev
    entrypoint: ["/usr/local/bin/entrypoint.backbone.sh"]
    # depends_on:
    #   - wellmed_pgbouncer_dev
    env_file:
      - .env.backbone
    environment:
      APP_ENV: development
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d
      PHP_UPLOAD_MAX_FILESIZE: 100M
      PHP_POST_MAX_SIZE: 100M
      PHP_MEMORY_LIMIT: -1

  wellmed_listener_dev:
    container_name: wellmed-listener-dev
    image: wellmed-listener-dev
    build:
      context: .
      dockerfile: ./docker-arm-dev/app/Dockerfile
      target: development
    volumes:
      - ./repositories:/app/repositories
      - ./app:/app/app
      - ./features:/app/features
      - ./config:/app/config
      - ./public:/app/public
      - ./database:/app/database
      - ./projects/wellmed-backbone:/app/projects/wellmed-backbone
      - ./projects/wellmed-gateway:/app/projects/wellmed-gateway
      - ./routes/api-backbone.php:/app/routes/api.php
      - ./composer_backbone.json:/app/composer.json
      - ./.env.backbone:/app/.env
      - wellmed_backbone_listener_dev:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "9013:9013"
    networks:
      - wellmed-core-dev
    entrypoint: ["/usr/local/bin/entrypoint.listener.sh"]   # <— LISTENER MODE (NO OCTANE)
    depends_on:
      - wellmed_dev
      # - wellmed_pgbouncer_dev
    env_file:
      - .env.backbone
    environment:
      APP_ENV: development
      PHP_MEMORY_LIMIT: 1024M

  wellmed_hq_dev:
    container_name: wellmed-hq-dev
    image: wellmed-hq-dev
    build:
      context: .
      dockerfile: ./docker/common/Dockerfile-hq
      target: development
    ports:
      - "${WELLMED_HQ_PORT:-9011}:${WELLMED_HQ_PORT:-9011}"
    volumes:
      - ./repositories:/app/repositories
      - ./app:/app/app
      - ./projects/hq:/app/projects/hq
      - ./features:/app/features
      - ./config:/app/config
      - ./public:/app/public
      - ./routes:/app/routes
      - ./database:/app/database
      - ./routes/api-hq.php:/app/routes/api.php
      - ./.env.hq:/app/.env
      - ./composer_hq.json:/app/composer.json
      - wellmed_hq_storage_dev:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9011 || exit 1"]
    networks:
      - wellmed-core-dev
    entrypoint: ["/usr/local/bin/entrypoint.hq.sh"]
    # depends_on:
    #   - wellmed_pgbouncer_dev
    env_file:
      - .env.hq
    environment:
      APP_ENV: development
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d
      PHP_UPLOAD_MAX_FILESIZE: 10M
      PHP_POST_MAX_SIZE: 10M

