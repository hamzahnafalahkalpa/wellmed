[databases]
; Central/Core database - connects to remote PostgreSQL server at 10.100.14.59
wellmed = host=10.100.14.59 port=5432 dbname=wellmed

; Wildcard for dynamic tenant databases
; PgBouncer will route to the same PostgreSQL server
* = host=10.100.14.59 port=5432

[pgbouncer]
; Connection pooling mode
; transaction = best performance for multi-tenant with search_path switching
pool_mode = transaction

; Listen on all interfaces
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Administrator settings
admin_users = admin_kalpa
stats_users = admin_kalpa

; Connection limits (team development workload on ARM server)
max_client_conn = 500
default_pool_size = 30
min_pool_size = 10
reserve_pool_size = 15
reserve_pool_timeout = 5

; Server connection limits per database
max_db_connections = 100
max_user_connections = 100

; Connection timeouts (seconds)
server_connect_timeout = 15
server_idle_timeout = 600
; Recycle connections every hour to prevent memory leaks
server_lifetime = 3600
server_login_retry = 15

; Query timeouts (standard for development)
; 2 minutes max query time
query_timeout = 120
query_wait_timeout = 120
; Cleanup idle clients after 15 minutes
client_idle_timeout = 900

; CRITICAL: Reset search_path between transactions to prevent tenant data leakage
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; TCP keepalive (important for remote connection)
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 5

; Logging (standard)
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
verbose = 0

; DNS settings
dns_max_ttl = 15
dns_nxdomain_ttl = 15

; Application name
application_name_add_host = 1

; Max prepared statements per connection
max_prepared_statements = 200

; Autodb feature - auto-create pool for any database
ignore_startup_parameters = extra_float_digits,options,application_name

; TLS/SSL (disabled for internal network)
;client_tls_sslmode = disable
;server_tls_sslmode = disable
