[unix_http_server]
file=/app/supervisor/run/supervisor.sock
chmod=0700
chown=www-data:www-data

[supervisord]
nodaemon=true
logfile=/app/supervisor/run/supervisord.log
pidfile=/app/supervisor/run/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///app/supervisor/run/supervisor.sock

; =============================================
; LISTENER CONTAINER - NO OCTANE (PRODUCTION)
; Only runs queue workers and REST listener
; For heavy jobs like tenant/db generation
; =============================================

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /app/artisan queue:work rabbitmq --queue=default,installation,elasticsearch,billing,satusehat,xendit,import,export --sleep=3 --tries=3 --timeout=3600 --max-jobs=100 --max-time=3600 --memory=512 --verbose
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
user=www-data
numprocs=4
stopwaitsecs=3610
stopsignal=SIGTERM
redirect_stderr=true
stdout_logfile=/app/supervisor/run/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:laravel-listener-rest]
command=/usr/local/bin/php /app/artisan serve --host=0.0.0.0 --port=9003
directory=/app
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/app/supervisor/run/listener-rest.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:laravel-listener-rest-staging]
command=/usr/local/bin/php /app/artisan serve --host=0.0.0.0 --port=9007
directory=/app
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/app/supervisor/run/listener-rest-staging.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
