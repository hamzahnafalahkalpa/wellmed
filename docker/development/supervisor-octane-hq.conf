[program:hq-octane]
command=php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=9001
directory=/app
user=www-data
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
killasgroup=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/app/supervisor/run/octane-hq.out.log
stderr_logfile=/app/supervisor/run/octane-hq.err.log