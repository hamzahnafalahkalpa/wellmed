[program:hq-octane]
command=php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=9001 --max-requests=500
directory=/app
user=www-data
autostart=true
autorestart=true
startretries=5
stopwaitsecs=30
killasgroup=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/app/supervisor/run/octane.out.log
stderr_logfile=/app/supervisor/run/octane.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
priority=10
