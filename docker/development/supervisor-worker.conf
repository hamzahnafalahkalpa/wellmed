[supervisord]
nodaemon=true
logfile=/app/supervisor/run/supervisord.log  ; pindah supaya www-data bisa tulis

[program:laravel-worker]
command=/usr/local/bin/php /app/artisan queue:work rabbitmq --queue=default,installation,elasticsearch,billing,satusehat,xendit,import,export --tries=1 --timeout=600 --verbose
directory=/app
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/app/supervisor/run/worker.log  ; pindah supaya writable
