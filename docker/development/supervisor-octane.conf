[program:backbone-octane]
command=php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=9000
directory=/app
user=www-data
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
killasgroup=true
stopsignal=TERM
stopasgroup=true
stdout_logfile=/app/supervisor/run/octane.out.log
stderr_logfile=/app/supervisor/run/octane.err.log