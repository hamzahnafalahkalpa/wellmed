[program:backbone-octane]
; FrankenPHP Octane with optimized settings for stability
command=php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=%(ENV_OCTANE_PORT)s --workers=%(ENV_OCTANE_WORKERS)s --max-requests=%(ENV_OCTANE_MAX_REQUESTS)s
directory=/app
user=www-data
autostart=true
autorestart=true
startretries=10
startsecs=10
stopwaitsecs=60
killasgroup=true
stopsignal=QUIT
stopasgroup=true
stdout_logfile=/app/supervisor/run/octane.out.log
stderr_logfile=/app/supervisor/run/octane.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
priority=10
; Environment defaults (can be overridden by .env)
environment=OCTANE_PORT="9000",OCTANE_WORKERS="4",OCTANE_MAX_REQUESTS="500"
