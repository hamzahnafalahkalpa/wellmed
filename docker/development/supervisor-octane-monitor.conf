[program:octane-monitor]
command=/app/docker/bin/octane-healthcheck.sh
directory=/app
user=root
autostart=true
autorestart=true
startretries=3
stdout_logfile=/app/supervisor/run/octane-monitor.out.log
stderr_logfile=/app/supervisor/run/octane-monitor.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
priority=20
