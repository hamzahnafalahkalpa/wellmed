[databases]
; Central/Core database - connects to external managed PostgreSQL
; REPLACE: staging-db.example.com with your actual staging database host
wellmed = host=staging-db.example.com port=5432 dbname=wellmed pool_size=30

; Wildcard for dynamic tenant databases
* = host=staging-db.example.com port=5432

[pgbouncer]
; Connection pooling mode
; transaction = best performance for multi-tenant with search_path switching
pool_mode = transaction

; Listen on all interfaces
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Administrator settings
admin_users = postgres
stats_users = postgres

; Connection limits (production-like testing workload)
max_client_conn = 1000
default_pool_size = 30
min_pool_size = 10
reserve_pool_size = 15
reserve_pool_timeout = 3

; Server connection limits per database
max_db_connections = 120
max_user_connections = 120

; Connection timeouts (seconds)
server_connect_timeout = 15
server_idle_timeout = 600
server_lifetime = 3600  ; 1 hour - recycle connections
server_login_retry = 15

; Query timeouts (balanced for staging)
query_timeout = 90  ; 90 seconds
query_wait_timeout = 120
client_idle_timeout = 900  ; 15 minutes

; CRITICAL: Reset search_path between transactions to prevent tenant data leakage
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; SSL/TLS Configuration (prefer for staging)
server_tls_sslmode = prefer
server_tls_protocols = secure

; TCP keepalive for cloud connections
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 5

; Logging (more verbose than production for debugging)
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
verbose = 0

; DNS settings for cloud databases
dns_max_ttl = 30
dns_nxdomain_ttl = 15

; Application name
application_name_add_host = 1

; Max prepared statements per connection
max_prepared_statements = 200  ; Laravel uses many prepared statements

; Autodb feature - auto-create pool for any database
ignore_startup_parameters = extra_float_digits,options,application_name
