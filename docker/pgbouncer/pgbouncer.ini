[databases]
; Central/Core database
wellmed = host=wellmed_postgres port=5432 dbname=wellmed

; Wildcard for dynamic tenant databases
; PgBouncer will route clinic_* databases to the same PostgreSQL server
* = host=wellmed_postgres port=5432

[pgbouncer]
; Connection pooling mode
; transaction = best performance, new server connection for each transaction
; session = keeps connection until client disconnects (safer for multi-tenant)
pool_mode = transaction

; Listen on all interfaces
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Administrator settings
admin_users = postgres
stats_users = postgres

; Connection limits
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 5

; Server connection limits per database
max_db_connections = 50
max_user_connections = 50

; Connection timeouts (seconds)
server_connect_timeout = 15
server_idle_timeout = 600
server_lifetime = 3600
server_login_retry = 15

; Query timeouts
query_timeout = 60
query_wait_timeout = 120
client_idle_timeout = 900

; Cancel query on client disconnect
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; Disable TCP keepalive (Docker networking handles this)
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 3

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
verbose = 0

; DNS settings
dns_max_ttl = 15
dns_nxdomain_ttl = 15

; Application name
application_name_add_host = 1

; Disable dangerous commands
disable_pqexec = 0

; Max prepared statements per connection
max_prepared_statements = 100

; Autodb feature - auto-create pool for any database
ignore_startup_parameters = extra_float_digits,options

; TLS/SSL (disabled for internal Docker network)
;client_tls_sslmode = disable
;server_tls_sslmode = disable
