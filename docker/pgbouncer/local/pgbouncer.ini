[databases]
; Central/Core database - connects to host PostgreSQL on port 5432
wellmed = host=host.docker.internal port=5432 dbname=wellmed

; Wildcard for dynamic tenant databases
; PgBouncer will route to the same PostgreSQL server
* = host=host.docker.internal port=5432

[pgbouncer]
; Connection pooling mode
; transaction = best performance for multi-tenant with search_path switching
pool_mode = transaction

; Listen on all interfaces
listen_addr = 0.0.0.0
listen_port = 5432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Administrator settings
admin_users = postgres
stats_users = postgres

; Connection limits (light load for single developer)
max_client_conn = 100
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 20
reserve_pool_timeout = 5

; Server connection limits per database
max_db_connections = 50
max_user_connections = 50

; Connection timeouts (seconds)
server_connect_timeout = 15
server_idle_timeout = 600
; Recycle connections every hour to prevent memory leaks
server_lifetime = 3600
server_login_retry = 15

; Query timeouts (relaxed for debugging)
; Prevent runaway queries from leaking memory
query_timeout = 300
query_wait_timeout = 120
; Cleanup idle clients after 30 minutes
client_idle_timeout = 1800

; CRITICAL: Reset search_path between transactions to prevent tenant data leakage
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; TCP keepalive
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 3

; Logging (verbose for debugging)
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
; Enable verbose logging for debugging
verbose = 1

; DNS settings
dns_max_ttl = 15
dns_nxdomain_ttl = 15

; Application name
application_name_add_host = 1

; Autodb feature - auto-create pool for any database
ignore_startup_parameters = extra_float_digits,options,application_name

; TLS/SSL (disabled for local development)
;client_tls_sslmode = disable
;server_tls_sslmode = disable
