[databases]
; Central/Core database - AWS RDS PostgreSQL primary endpoint
; REPLACE: wellmed-prod.xxxxx.us-east-1.rds.amazonaws.com with your actual RDS endpoint
wellmed = host=wellmed-prod.xxxxx.us-east-1.rds.amazonaws.com port=5432 dbname=wellmed pool_size=40

; Read replica for reports (optional - configure if you have RDS read replicas)
; REPLACE: wellmed-prod-ro.xxxxx.us-east-1.rds.amazonaws.com with your actual RDS read replica endpoint
; wellmed_read = host=wellmed-prod-ro.xxxxx.us-east-1.rds.amazonaws.com port=5432 dbname=wellmed pool_size=30

; Wildcard for dynamic tenant databases (all use the same RDS instance)
* = host=wellmed-prod.xxxxx.us-east-1.rds.amazonaws.com port=5432

[pgbouncer]
; Connection pooling mode
; transaction = best performance for multi-tenant with search_path switching
pool_mode = transaction

; Listen on all interfaces
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Administrator settings
admin_users = postgres
stats_users = postgres

; Connection limits (high-performance for 50-500 tenants)
max_client_conn = 2000
default_pool_size = 40
min_pool_size = 15
reserve_pool_size = 20
reserve_pool_timeout = 3

; Server connection limits per database
max_db_connections = 150
max_user_connections = 150

; Connection timeouts (seconds) - optimized for production
server_connect_timeout = 15
server_idle_timeout = 600
server_lifetime = 1800  ; 30 minutes - recycle connections to prevent stale connections
server_login_retry = 15

; Query timeouts (strict for production)
query_timeout = 60  ; 1 minute - prevents long-running queries
query_wait_timeout = 120
client_idle_timeout = 900  ; 15 minutes

; CRITICAL: Reset search_path between transactions to prevent tenant data leakage
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; AWS RDS SSL/TLS Configuration (REQUIRED for production security)
server_tls_sslmode = require
server_tls_ca_file = /etc/pgbouncer/rds-ca-bundle.pem
server_tls_protocols = secure

; DNS caching for RDS endpoints (RDS uses DNS for failover)
dns_max_ttl = 60  ; Cache DNS for 1 minute
dns_nxdomain_ttl = 15

; TCP keepalive for cloud connections (prevents connection drops)
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 5

; Logging (minimal for production performance)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
verbose = 0
syslog = 1  ; Send logs to syslog

; Application name
application_name_add_host = 1

; Max prepared statements per connection
max_prepared_statements = 200  ; Laravel uses many prepared statements

; Autodb feature - auto-create pool for any database
ignore_startup_parameters = extra_float_digits,options,application_name

; Additional production optimizations
; Disable dangerous commands
disable_pqexec = 0

; Connection sanity checks
server_check_delay = 30
server_check_query = SELECT 1
