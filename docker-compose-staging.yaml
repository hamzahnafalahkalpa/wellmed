services:
  wellmed:
    container_name: wellmed-backbone-staging
    image: wellmed-backbone
    build:
      context: .
      dockerfile: ./docker/common/Dockerfile-backbone-dev
      target: production
    ports:
      - "${WELLMED_BACKBONE_PORT:-9011}:${WELLMED_BACKBONE_PORT:-9011}"
    volumes:
      - ./repositories:/app/repositories
      - ./app:/app/app
      - ./features:/app/features
      - ./config:/app/config
      - ./public:/app/public
      - ./database:/app/database
      - ./projects/wellmed-backbone:/app/projects/wellmed-backbone
      - ./projects/wellmed-gateway:/app/projects/wellmed-gateway
      - ./routes/api-backbone.php:/app/routes/api.php
      - ./composer_backbone.json:/app/composer.json
      - ./.env.backbone:/app/.env
      - wellmed_backbone_staging_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9011 || exit 1"]
    networks:
      - wellmed-core
    entrypoint: ["/usr/local/bin/entrypoint.backbone.sh"]
    env_file:
      - .env.backbone
    environment:
      APP_ENV: staging
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d
      PHP_UPLOAD_MAX_FILESIZE: 10M
      PHP_POST_MAX_SIZE: 10M

  wellmed_listener:
    container_name: wellmed-listener-staging
    image: wellmed-backbone
    build:
      context: .
      dockerfile: ./docker/common/Dockerfile-backbone-dev
      target: production
    volumes:
      - ./repositories:/app/repositories
      - ./app:/app/app
      - ./features:/app/features
      - ./config:/app/config
      - ./public:/app/public
      - ./database:/app/database
      - ./projects/wellmed-backbone:/app/projects/wellmed-backbone
      - ./projects/wellmed-gateway:/app/projects/wellmed-gateway
      - ./routes/api-backbone.php:/app/routes/api.php
      - ./composer_backbone.json:/app/composer.json
      - ./.env.backbone:/app/.env
      - wellmed_backbone_listener_staging:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "9013:9013"
    networks:
      - wellmed-core
    entrypoint: ["/usr/local/bin/entrypoint.worker.sh"]     # <— WORKER MODE
    depends_on:
      - wellmed
    env_file:
      - .env.backbone
    environment:
      APP_ENV: staging

  wellmed_hq:
    container_name: wellmed-hq
    image: wellmed-hq
    build:
      context: .
      dockerfile: ./docker/common/Dockerfile-hq
      target: production
    ports:
      - "${WELLMED_HQ_PORT:-9015}:${WELLMED_HQ_PORT:-9015}"
    volumes:
      - ./repositories:/app/repositories
      - ./app:/app/app
      - ./projects/hq:/app/projects/hq
      - ./features:/app/features
      - ./config:/app/config
      - ./public:/app/public
      - ./routes:/app/routes
      - ./database:/app/database
      - ./routes/api-hq.php:/app/routes/api.php
      - ./.env.hq:/app/.env
      - ./composer_hq.json:/app/composer.json
      - wellmed_hq_staging_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9015 || exit 1"]
    networks:
      - wellmed-core
    entrypoint: ["/usr/local/bin/entrypoint.hq.sh"]
    env_file:
      - .env.hq
    environment:
      APP_ENV: staging
      PHP_INI_SCAN_DIR: /usr/local/etc/php/conf.d
      PHP_UPLOAD_MAX_FILESIZE: 10M
      PHP_POST_MAX_SIZE: 10M

networks:
  wellmed-core:
    driver: bridge

volumes:  
  wellmed_backbone_staging_storage:
  wellmed_backbone_listener_staging:
  wellmed_hq_staging_storage:
  redis_data:
  pgsql_data:
  rabbitmq_data: